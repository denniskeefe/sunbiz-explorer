[project]
name = "sunbiz-explorer"
version = "0.1.0"
description = "Source-linked Sunbiz registered-agent and business relationship explorer"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<0.136",
    "starlette>=0.40,<1",
    "uvicorn>=0.30,<1",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "anyio>=4.8,<4.14",
    "pytest>=8,<10",
]

[tool.vercel]
entrypoint = "backend:app"
